<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mana Telangana - Prajavani AI Civic Super-App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0E1117;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
        .fallback-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #0E1117;
            color: #FFFFFF;
            z-index: -1;
            padding: 2rem;
            text-align: center;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 5px solid rgba(255,255,255,0.1);
            border-bottom-color: #008080;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
            margin-bottom: 1.5rem;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn-link {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            background-color: #008080;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="fallback-container">
        <div class="spinner"></div>
        <h2>Loading Mana Telangana Application...</h2>
        <p style="color: #94A3B8; margin-top: 0.5rem;">Connecting to Streamlit Engine</p>
        <a href="https://mana-telangana.streamlit.app" target="_blank" class="btn-link">Open Directly in Streamlit Cloud</a>
    </div>

    <!-- Embedded Full-Screen Streamlit Application -->
    <iframe src="https://mana-telangana.streamlit.app/?embed=true" allow="camera; microphone; geolocation"></iframe>
</body>
</html>
